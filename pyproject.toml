[project]
name = "tic-tac-toe-titans"
version = "1.0.0"
description = "A polished tic-tac-toe desktop app with minimax AI, tests, and CI."
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001"]
